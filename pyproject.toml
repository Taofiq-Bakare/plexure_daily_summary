[project]
name = "plexure-data-engineering"
version = "0.1.0"
description = "Store daily sales summary pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.13.0",
    "jupyter>=1.1.1",
    "pandas>=3.0.2",
    "typer>=0.15.0",
]

[project.scripts]
plexure-summary = "plexure.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plexure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
